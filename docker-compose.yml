# Local / single-host deployment of Sentinel.
#   docker compose up --build
# API on http://localhost:8000, Streamlit UI on http://localhost:8501.
# Secrets come from .env.local (gitignored); see sentinel/.env.example.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env.local
        required: false
    environment:
      SENTINEL_DB_PATH: /app/sentinel/db/audit.sqlite
    volumes:
      - sentinel-db:/app/sentinel/db
      - sentinel-data:/app/sentinel/data

  ui:
    build: .
    command:
      [
        "streamlit",
        "run",
        "sentinel/app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--server.headless",
        "true",
      ]
    ports:
      - "8501:8501"
    env_file:
      - path: .env.local
        required: false
    environment:
      SENTINEL_DB_PATH: /app/sentinel/db/audit.sqlite
    volumes:
      - sentinel-db:/app/sentinel/db
      - sentinel-data:/app/sentinel/data

  # Ops sidecars — enable with:  docker compose --profile ops up -d
  backup:
    build: .
    profiles: ["ops"]
    command:
      [
        "python",
        "-m",
        "sentinel.tools.backup",
        "--output-dir",
        "/app/sentinel/db/backups",
        "--keep",
        "14",
        "--every-hours",
        "24",
      ]
    environment:
      SENTINEL_DB_PATH: /app/sentinel/db/audit.sqlite
    volumes:
      - sentinel-db:/app/sentinel/db

  retention:
    build: .
    profiles: ["ops"]
    command:
      [
        "python",
        "-m",
        "sentinel.tools.retention",
        "--uploads-days",
        "30",
        "--quarantine-days",
        "90",
        "--cache-days",
        "30",
        "--every-hours",
        "24",
      ]
    environment:
      SENTINEL_DB_PATH: /app/sentinel/db/audit.sqlite
    volumes:
      - sentinel-db:/app/sentinel/db
      - sentinel-data:/app/sentinel/data

volumes:
  sentinel-db:
  sentinel-data:
