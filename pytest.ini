[pytest]
testpaths = sentinel/tests

# The suite mixes two conventions: unittest.TestCase subclasses (collected by
# pytest regardless of name) and plain classes named "<Subject>Tests". Without
# adding the trailing-"Tests" pattern here, pytest's default "Test*" prefix
# silently skips every plain class — collecting nothing at all from several
# files while still reporting a green run.
python_classes = Test* *Tests

filterwarnings =
    ignore::DeprecationWarning:starlette.*
